<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Converter & Compressor</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    background:
    radial-gradient(circle at top left,#1e293b 0%,#09090b 45%),
    radial-gradient(circle at bottom right,#0f172a 0%,#09090b 50%);
}
.glass{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.08);
}
.drop-active{
    border-color:#38bdf8 !important;
    background:rgba(56,189,248,.08);
    transform:scale(1.01);
}
::-webkit-scrollbar{
    width:8px;
}
::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}
</style>
</head>

<body class="min-h-screen text-slate-100">

<div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-400 bg-clip-text text-transparent">
            Image Converter & Compressor
        </h1>
        <p class="text-slate-400 mt-3 text-lg">
            Convert and compress images instantly in your browser.
        </p>
    </div>

    <!-- Main Grid -->
    <div class="grid lg:grid-cols-3 gap-6">

        <!-- Left Column -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Upload Zone -->
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <label
                    id="dropZone"
                    tabindex="0"
                    aria-label="Upload images"
                    class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-slate-600 rounded-2xl min-h-[260px] transition-all duration-300 hover:border-cyan-400"
                >
                    <svg class="w-16 h-16 text-cyan-400 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path d="M12 16V4m0 0l-4 4m4-4l4 4"/>
                        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
                    </svg>

                    <h2 class="text-xl font-semibold">
                        Drag & Drop Images Here
                    </h2>

                    <p class="text-slate-400 mt-2">
                        or click to browse files
                    </p>

                    <p class="text-xs text-slate-500 mt-3">
                        PNG • JPG • JPEG • WEBP
                    </p>

                    <input
                        id="fileInput"
                        type="file"
                        accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                        multiple
                        class="hidden"
                    />
                </label>
            </div>

            <!-- Preview Section -->
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-semibold">Image Preview</h2>
                    <span id="previewCount" class="text-sm text-slate-400">
                        0 Images
                    </span>
                </div>

                <div
                    id="previewGrid"
                    class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"
                >
                </div>

                <div id="emptyState" class="text-center py-12 text-slate-500">
                    No images uploaded yet.
                </div>
            </div>

        </div>

        <!-- Right Column -->
        <div class="space-y-6">

            <!-- Settings -->
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold mb-5">Settings</h2>

                <!-- Format -->
                <div class="mb-5">
                    <label class="block mb-2 text-sm text-slate-300">
                        Output Format
                    </label>

                    <select
                        id="formatSelect"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    >
                        <option value="png">PNG</option>
                        <option value="jpeg">JPG</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>

                <!-- Quality -->
                <div id="qualitySection" class="mb-5">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm text-slate-300">
                            Quality
                        </label>
                        <span id="qualityValue">80%</span>
                    </div>

                    <input
                        id="qualitySlider"
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                        class="w-full"
                    />
                </div>

                <!-- Resize -->
                <div>
                    <h3 class="text-sm text-slate-300 mb-3">
                        Optional Resize
                    </h3>

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input
                            id="widthInput"
                            type="number"
                            placeholder="Width"
                            class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"
                        />

                        <input
                            id="heightInput"
                            type="number"
                            placeholder="Height"
                            class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"
                        />
                    </div>

                    <label class="flex items-center gap-2 text-sm">
                        <input
                            checked
                            id="aspectRatio"
                            type="checkbox"
                        />
                        Maintain aspect ratio
                    </label>
                </div>
            </div>

            <!-- Statistics -->
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold mb-5">Statistics</h2>

                <div class="space-y-4 text-sm">

                    <div class="flex justify-between">
                        <span>Total Images</span>
                        <span id="statImages">0</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Total Size</span>
                        <span id="statSize">0 MB</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Output Format</span>
                        <span id="statFormat">PNG</span>
                    </div>

                    <div class="flex justify-between">
                        <span>Status</span>
                        <span id="statusText" class="text-yellow-400">
                            Idle
                        </span>
                    </div>

                </div>
            </div>

            <!-- Progress -->
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <div class="flex justify-between mb-2">
                    <span>Progress</span>
                    <span id="progressPercent">0%</span>
                </div>

                <div class="h-3 bg-slate-800 rounded-full overflow-hidden">
                    <div
                        id="progressBar"
                        class="h-full w-0 bg-gradient-to-r from-cyan-500 to-indigo-500 transition-all duration-300"
                    ></div>
                </div>

                <div
                    id="spinner"
                    class="hidden mt-4 flex justify-center"
                >
                    <div class="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>

            <!-- Actions -->
            <div class="space-y-3">

                <button
                    id="convertBtn"
                    class="w-full py-4 rounded-2xl font-semibold bg-gradient-to-r from-cyan-500 to-blue-600 hover:scale-[1.02] transition-all shadow-xl"
                >
                    Convert & Download
                </button>

                <button
                    id="zipBtn"
                    class="w-full py-4 rounded-2xl font-semibold bg-gradient-to-r from-violet-500 to-purple-600 hover:scale-[1.02] transition-all shadow-xl"
                >
                    Download All ZIP
                </button>

                <button
                    id="resetBtn"
                    class="w-full py-4 rounded-2xl font-semibold bg-slate-800 hover:bg-slate-700 transition-all"
                >
                    Reset
                </button>

            </div>

        </div>
    </div>
</div>

<!-- Notification -->
<div
    id="toast"
    class="fixed top-5 right-5 translate-x-[150%] transition-all duration-500 z-50 bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl shadow-xl"
></div>

<script>
/* =====================================================
   STATE
===================================================== */

const filesData = [];

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const previewGrid = document.getElementById("previewGrid");
const emptyState = document.getElementById("emptyState");

const formatSelect = document.getElementById("formatSelect");
const qualitySlider = document.getElementById("qualitySlider");
const qualityValue = document.getElementById("qualityValue");
const qualitySection = document.getElementById("qualitySection");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const aspectRatio = document.getElementById("aspectRatio");

const statImages = document.getElementById("statImages");
const statSize = document.getElementById("statSize");
const statFormat = document.getElementById("statFormat");

const progressBar = document.getElementById("progressBar");
const progressPercent = document.getElementById("progressPercent");

const statusText = document.getElementById("statusText");
const previewCount = document.getElementById("previewCount");

const spinner = document.getElementById("spinner");

/* =====================================================
   HELPERS
===================================================== */

function showToast(message,color="cyan"){
    const toast = document.getElementById("toast");

    toast.innerHTML = message;
    toast.className =
    `fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl border bg-slate-900 transition-all duration-500 border-${color}-500`;

    toast.style.transform="translateX(0)";

    setTimeout(()=>{
        toast.style.transform="translateX(150%)";
    },3000);
}

function formatBytes(bytes){
    if(bytes===0) return "0 Bytes";
    const k=1024;
    const sizes=["Bytes","KB","MB","GB"];
    const i=Math.floor(Math.log(bytes)/Math.log(k));
    return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+" "+sizes[i];
}

function updateStats(){

    statImages.textContent = filesData.length;

    const total = filesData.reduce((a,b)=>a+b.file.size,0);

    statSize.textContent = formatBytes(total);

    statFormat.textContent = formatSelect.value.toUpperCase();

    previewCount.textContent =
        `${filesData.length} Image${filesData.length!==1?"s":""}`;

    emptyState.style.display =
        filesData.length ? "none":"block";
}

function setProgress(percent){
    progressBar.style.width = percent + "%";
    progressPercent.textContent = percent + "%";
}

/* =====================================================
   FILE HANDLING
===================================================== */

function validateFile(file){

    const valid = [
        "image/png",
        "image/jpeg",
        "image/jpg",
        "image/webp"
    ];

    return valid.includes(file.type);
}

async function processUpload(file){

    if(!validateFile(file)){
        showToast("Unsupported file: "+file.name,"red");
        return;
    }

    const url = URL.createObjectURL(file);

    const img = new Image();

    img.src = url;

    await new Promise((resolve,reject)=>{
        img.onload=resolve;
        img.onerror=reject;
    }).catch(()=>{
        showToast("Corrupted image: "+file.name,"red");
        return;
    });

    const item = {
        file,
        width:img.width,
        height:img.height,
        url
    };

    filesData.push(item);

    renderPreview(item);
    updateStats();
}

function renderPreview(item){

    const index = filesData.indexOf(item);

    const card = document.createElement("div");

    card.className =
    "glass rounded-2xl overflow-hidden border border-slate-700";

    card.dataset.index=index;

    card.innerHTML=`
        <div class="aspect-video overflow-hidden">
            <img
            src="${item.url}"
            alt=""
            class="w-full h-full object-cover">
        </div>

        <div class="p-3 text-xs space-y-1">
            <p class="font-medium truncate">${item.file.name}</p>
            <p>Format: ${item.file.type.split('/')[1].toUpperCase()}</p>
            <p>${item.width} × ${item.height}</p>
            <p>${formatBytes(item.file.size)}</p>

            <button
            class="removeBtn mt-2 w-full bg-red-500/20 text-red-300 rounded-lg py-2 hover:bg-red-500/30">
            Remove
            </button>
        </div>
    `;

    card.querySelector(".removeBtn")
    .addEventListener("click",()=>{

        const idx = filesData.indexOf(item);

        if(idx>-1){

            URL.revokeObjectURL(item.url);

            filesData.splice(idx,1);

            card.remove();

            updateStats();
        }
    });

    previewGrid.appendChild(card);
}

/* =====================================================
   EVENTS
===================================================== */

fileInput.addEventListener("change",async e=>{

    const files=[...e.target.files];

    for(const file of files){
        await processUpload(file);
    }
});

dropZone.addEventListener("click",()=>fileInput.click());

dropZone.addEventListener("dragover",e=>{
    e.preventDefault();
    dropZone.classList.add("drop-active");
});

dropZone.addEventListener("dragleave",()=>{
    dropZone.classList.remove("drop-active");
});

dropZone.addEventListener("drop",async e=>{

    e.preventDefault();

    dropZone.classList.remove("drop-active");

    const files=[...e.dataTransfer.files];

    for(const file of files){
        await processUpload(file);
    }
});

qualitySlider.addEventListener("input",()=>{
    qualityValue.textContent =
    qualitySlider.value + "%";
});

formatSelect.addEventListener("change",()=>{

    statFormat.textContent =
    formatSelect.value.toUpperCase();

    if(formatSelect.value==="png"){
        qualitySection.classList.add("hidden");
    }else{
        qualitySection.classList.remove("hidden");
    }
});

/* =====================================================
   CONVERSION
===================================================== */

function convertImage(fileData){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.onload = ()=>{

            try{

                let width = img.width;
                let height = img.height;

                const customWidth =
                    parseInt(widthInput.value);

                const customHeight =
                    parseInt(heightInput.value);

                if(customWidth || customHeight){

                    if(aspectRatio.checked){

                        if(customWidth){

                            height =
                            Math.round(
                            img.height *
                            (customWidth/img.width)
                            );

                            width = customWidth;
                        }

                        else if(customHeight){

                            width =
                            Math.round(
                            img.width *
                            (customHeight/img.height)
                            );

                            height = customHeight;
                        }

                    }else{

                        width =
                        customWidth || width;

                        height =
                        customHeight || height;
                    }
                }

                const canvas =
                document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx =
                canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                const format =
                formatSelect.value;

                const mime =
                "image/"+format;

                const quality =
                Number(qualitySlider.value)/100;

                canvas.toBlob(blob=>{

                    if(!blob){
                        reject();
                        return;
                    }

                    resolve(blob);

                },mime,quality);

            }catch(err){
                reject(err);
            }
        };

        img.onerror=reject;

        img.src = fileData.url;
    });
}

function downloadBlob(blob,name){

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href=url;
    a.download=name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);
}

function outputName(original){

    const base =
    original.replace(/\.[^/.]+$/,"");

    const ext =
    formatSelect.value==="jpeg"
    ? "jpg"
    : formatSelect.value;

    return `${base}.${ext}`;
}

/* =====================================================
   DOWNLOAD BUTTON
===================================================== */

document
.getElementById("convertBtn")
.addEventListener("click",async ()=>{

    if(!filesData.length){
        showToast("Please upload images first","red");
        return;
    }

    spinner.classList.remove("hidden");

    statusText.textContent="Processing";

    setProgress(0);

    try{

        for(let i=0;i<filesData.length;i++){

            const blob =
            await convertImage(filesData[i]);

            downloadBlob(
                blob,
                outputName(filesData[i].file.name)
            );

            const progress =
            Math.round(
            ((i+1)/filesData.length)*100
            );

            setProgress(progress);
        }

        statusText.textContent="Completed";

        showToast("Conversion completed","green");

    }catch(err){

        statusText.textContent="Failed";

        showToast(
        "Conversion failed",
        "red"
        );
    }

    spinner.classList.add("hidden");
});

/* =====================================================
   ZIP DOWNLOAD
===================================================== */

document
.getElementById("zipBtn")
.addEventListener("click",async ()=>{

    if(!filesData.length){

        showToast(
        "Please upload images first",
        "red"
        );

        return;
    }

    spinner.classList.remove("hidden");

    setProgress(0);

    statusText.textContent="Creating ZIP";

    try{

        const zip = new JSZip();

        for(let i=0;i<filesData.length;i++){

            const blob =
            await convertImage(filesData[i]);

            zip.file(
                outputName(
                filesData[i].file.name
                ),
                blob
            );

            setProgress(
            Math.round(
            ((i+1)/filesData.length)*100
            ));
        }

        const content =
        await zip.generateAsync({
            type:"blob"
        });

        downloadBlob(
            content,
            "converted-images.zip"
        );

        statusText.textContent="ZIP Ready";

        showToast(
        "ZIP downloaded successfully",
        "green"
        );

    }catch(err){

        showToast(
        "ZIP generation failed",
        "red"
        );

        statusText.textContent="Failed";
    }

    spinner.classList.add("hidden");
});

/* =====================================================
   RESET
===================================================== */

document
.getElementById("resetBtn")
.addEventListener("click",()=>{

    filesData.forEach(item=>{
        URL.revokeObjectURL(item.url);
    });

    filesData.length=0;

    previewGrid.innerHTML="";

    fileInput.value="";

    formatSelect.value="png";

    qualitySlider.value=80;

    qualityValue.textContent="80%";

    widthInput.value="";
    heightInput.value="";

    aspectRatio.checked=true;

    qualitySection.classList.add("hidden");

    statusText.textContent="Idle";

    setProgress(0);

    updateStats();

    showToast("Reset completed","cyan");
});

/* =====================================================
   ACCESSIBILITY
===================================================== */

dropZone.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" || e.key===" "){
        e.preventDefault();
        fileInput.click();
    }
});

/* =====================================================
   INIT
===================================================== */

qualitySection.classList.add("hidden");
updateStats();

</script>

</body>
</html>
